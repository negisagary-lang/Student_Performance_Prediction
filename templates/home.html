<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Score | Student Performance</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<nav>
    <span class="brand">Student Performance Prediction</span>
    <div>
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/predictdata">Predict Score</a>
    </div>
</nav>

<div class="container">
    <h2>Predict Math Score</h2>
    <p>Fill in the details below to predict a student's math score.</p>

    <div class="card">
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <div class="form-group">
                <label for="gender">Gender</label>
                <select class="form-control" id="gender" name="gender" required>
                    <option value="" selected disabled>Select your Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ethnicity">Race / Ethnicity</label>
                <select class="form-control" id="ethnicity" name="ethnicity" required>
                    <option value="" selected disabled>Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="form-group">
                <label for="parental_level_of_education">Parental Level of Education</label>
                <select class="form-control" id="parental_level_of_education" name="parental_level_of_education" required>
                    <option value="" selected disabled>Select Parent Education</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="high school">High School</option>
                    <option value="master's degree">Master's Degree</option>
                    <option value="some college">Some College</option>
                    <option value="some high school">Some High School</option>
                </select>
            </div>

            <div class="form-group">
                <label for="lunch">Lunch Type</label>
                <select class="form-control" id="lunch" name="lunch" required>
                    <option value="" selected disabled>Select Lunch Type</option>
                    <option value="free/reduced">Free / Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="form-group">
                <label for="test_preparation_course">Test Preparation Course</label>
                <select class="form-control" id="test_preparation_course" name="test_preparation_course" required>
                    <option value="" selected disabled>Select Option</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label for="reading_score">Reading Score (out of 100)</label>
                <input class="form-control" id="reading_score" type="number" name="reading_score"
                    placeholder="Enter Reading Score" min="0" max="100" required />
            </div>

            <div class="form-group">
                <label for="writting_score">Writing Score (out of 100)</label>
                <input class="form-control" id="writting_score" type="number" name="writting_score"
                    placeholder="Enter Writing Score" min="0" max="100" required />
            </div>

            <input class="btn btn-block" type="submit" value="Predict Math Score" />
        </form>
    </div>

    {% if results is not none %}
    <div class="result">
        Predicted Math Score: <strong>{{ results }}</strong>
    </div>
    {% endif %}
</div>

<footer>Built with Flask, scikit-learn, XGBoost and CatBoost</footer>

</body>
</html>
